name: Keep Supabase Alive

# Supabase 免費方案一週沒有活動就會暫停專案;這支排程定期讀一筆公開資料把它叫醒。
# 只用公開的 anon key(本來就包含在前端程式裡),不用 service key —— 叫醒資料庫不需要管理權限。
# ClinCalc 與 ExClinCalc 共用同一個 Supabase 專案,兩個 repo 用同樣的兩個 secret 名稱。

on:
  schedule:
    # 每 3 天執行一次，UTC 00:00（台灣時間 08:00）
    - cron: '0 0 */3 * *'
  workflow_dispatch: # 可手動觸發

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SB_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SB_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SB_URL" ] || [ -z "$SB_KEY" ]; then
            echo "缺少 NEXT_PUBLIC_SUPABASE_URL / NEXT_PUBLIC_SUPABASE_ANON_KEY GitHub secret"
            exit 1
          fi
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SB_URL/rest/v1/medications?select=id&limit=1" \
            -H "apikey: $SB_KEY")
          echo "Supabase response: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Warning: unexpected status $STATUS"
            exit 1
          fi
          echo "Supabase is alive ✓"

name: Sync Medical References

# 把 src/lib/referenceRanges.ts 的參考值同步到 medical_references。
# 需要 repo secrets：SUPABASE_URL、SUPABASE_SERVICE_KEY。還沒放上 GitHub，
# 所以先改成手動觸發（原本每月 1 日自動跑，但因為缺 secret 一直失敗）。
on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check for reference updates
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/sync-references.mjs

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: 型別檢查 + KDIGO 邊界值測試
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
